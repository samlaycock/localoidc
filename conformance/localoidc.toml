# localoidc configuration used for OpenID conformance suite runs (see README.md).
# The suite reaches this server through the Caddy TLS proxy in docker-compose.yml,
# so the public issuer is https://localoidc.test while the process listens on the host.
host = "127.0.0.1"
port = 9450
issuer = "https://localoidc.test"
# Release only the standard claims the requested scopes allow (OIDC Core 5.4).
claims_by_scope = true

# Static clients used by configs/static.json. Redirect URIs are the suite's
# callback for the "localoidc" alias.
[[clients]]
client_id = "conformance-client-1"
client_secret = "conformance-secret-1"
client_name = "Conformance client 1"
redirect_uris = [
  "https://localhost.emobix.co.uk:8443/test/a/localoidc/callback",
  "https://localhost.emobix.co.uk:8443/test/a/localoidc/callback?dummy1=lorem&dummy2=ipsum",
]
post_logout_redirect_uris = ["https://localhost.emobix.co.uk:8443/test/a/localoidc/post_logout_redirect"]

[[clients]]
client_id = "conformance-client-2"
client_secret = "conformance-secret-2"
client_name = "Conformance client 2"
redirect_uris = [
  "https://localhost.emobix.co.uk:8443/test/a/localoidc/callback",
  "https://localhost.emobix.co.uk:8443/test/a/localoidc/callback?dummy1=lorem&dummy2=ipsum",
]
post_logout_redirect_uris = ["https://localhost.emobix.co.uk:8443/test/a/localoidc/post_logout_redirect"]

# Used by oidcc-server-client-secret-post (configs/static.json "client_secret_post").
[[clients]]
client_id = "conformance-client-post"
client_secret = "conformance-secret-post"
client_name = "Conformance client (client_secret_post)"
token_endpoint_auth_method = "client_secret_post"
redirect_uris = ["https://localhost.emobix.co.uk:8443/test/a/localoidc/callback"]
