[package]
name = "localoidc"
version = "0.1.0"
edition = "2024"
description = "A local OpenID Connect / OAuth 2.0 provider for offline development and testing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samlaycock/localoidc"
readme = "README.md"
keywords = ["oidc", "oauth2", "openid-connect", "testing", "identity-provider"]
categories = ["development-tools::testing", "authentication"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rsa = { version = "0.9", features = ["sha2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.29.0", features = ["v4"] }

# RSA key generation is painfully slow without optimisation.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[profile.release]
strip = "symbols"
